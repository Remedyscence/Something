<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя визитка</title>
  <style>
    /* Цвета в стиле Discord */
    :root {
      --bg-page: #1e1f22;
      --bg-card: #2b2d31;
      --bg-section: #232428;
      --text-main: #f2f3f5;
      --text-muted: #b5bac1;
      --turquoise: #2ee6d6;
      --peach: 255, 183, 148;   /* RGB, чтобы задавать прозрачность */
      --violet: 138, 92, 246;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      overflow-x: hidden;
    }

    /* ---------- Карточка профиля ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* Баннер с GIF */
    .banner {
      position: relative;
      height: 220px;
      background: url("banner.gif") center / cover no-repeat;
    }

    /* Полупрозрачный градиент поверх баннера: персиковый → фиолетовый */
    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(var(--peach), 0.45),
        rgba(var(--violet), 0.55)
      );
    }

    /* Аватарка заходит на баннер за счёт отрицательного отступа */
    .profile {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 16px;
      padding: 0 24px;
      margin-top: -64px;
    }

    .avatar {
      width: 128px;
      height: 128px;
      flex-shrink: 0;
      border-radius: 50%;
      background: url("avatar.gif") center / cover no-repeat;
      border: 4px solid var(--turquoise);
      /* Тёмное кольцо-"вырез" как в Discord + бирюзовое свечение */
      box-shadow:
        0 0 0 4px var(--bg-card),
        0 0 14px 4px rgba(46, 230, 214, 0.6);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow:
          0 0 0 4px var(--bg-card),
          0 0 14px 4px rgba(46, 230, 214, 0.6);
      }
      50% {
        box-shadow:
          0 0 0 4px var(--bg-card),
          0 0 32px 12px rgba(46, 230, 214, 0.95);
      }
    }

    .profile-info {
      padding-bottom: 10px;
    }

    .name {
      margin: 0;
      font-size: 24px;
    }

    .tag {
      margin: 2px 0 0;
      color: var(--text-muted);
    }

    /* Блок "Обо мне" */
    .about {
      margin: 20px 24px 24px;
      padding: 16px;
      background: var(--bg-section);
      border-radius: 8px;
    }

    .about h2 {
      margin: 0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .about p {
      margin: 0;
      line-height: 1.5;
    }

    /* ---------- Падающие лепестки сакуры ---------- */
    .sakura {
      position: fixed;
      inset: 0;
      pointer-events: none; /* лепестки не мешают кликать */
      z-index: 10;
      overflow: hidden;
    }

    .sakura span {
      position: absolute;
      top: -20px;
      width: 14px;
      height: 10px;
      background: linear-gradient(135deg, #ffd1dc, #ff9ec4);
      border-radius: 100% 0 100% 0; /* форма лепестка */
      opacity: 0.85;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      25% {
        transform: translate(40px, 25vh) rotate(90deg);
      }
      50% {
        transform: translate(-20px, 50vh) rotate(180deg);
      }
      75% {
        transform: translate(50px, 75vh) rotate(270deg);
      }
      100% {
        transform: translate(0, 105vh) rotate(360deg);
      }
    }

    /* У каждого лепестка своя позиция, размер, скорость и задержка */
    .sakura span:nth-child(1)  { left: 5%;  animation-duration: 9s;  animation-delay: 0s; }
    .sakura span:nth-child(2)  { left: 15%; animation-duration: 12s; animation-delay: 3s;  width: 10px; height: 7px; }
    .sakura span:nth-child(3)  { left: 25%; animation-duration: 10s; animation-delay: 6s; }
    .sakura span:nth-child(4)  { left: 35%; animation-duration: 14s; animation-delay: 1s;  width: 18px; height: 13px; }
    .sakura span:nth-child(5)  { left: 45%; animation-duration: 11s; animation-delay: 4s;  width: 10px; height: 7px; }
    .sakura span:nth-child(6)  { left: 55%; animation-duration: 13s; animation-delay: 7s; }
    .sakura span:nth-child(7)  { left: 65%; animation-duration: 9s;  animation-delay: 2s;  width: 16px; height: 12px; }
    .sakura span:nth-child(8)  { left: 75%; animation-duration: 12s; animation-delay: 5s;  width: 10px; height: 7px; }
    .sakura span:nth-child(9)  { left: 85%; animation-duration: 10s; animation-delay: 8s; }
    .sakura span:nth-child(10) { left: 95%; animation-duration: 15s; animation-delay: 0.5s; width: 12px; height: 9px; }
    .sakura span:nth-child(11) { left: 10%; animation-duration: 16s; animation-delay: 9s;  width: 18px; height: 13px; }
    .sakura span:nth-child(12) { left: 50%; animation-duration: 8s;  animation-delay: 10s; width: 10px; height: 7px; }
    .sakura span:nth-child(13) { left: 70%; animation-duration: 14s; animation-delay: 6.5s; }
    .sakura span:nth-child(14) { left: 30%; animation-duration: 11s; animation-delay: 11s; width: 12px; height: 9px; }
    .sakura span:nth-child(15) { left: 90%; animation-duration: 9s;  animation-delay: 4.5s; width: 16px; height: 12px; }

    /* Для тех, у кого в системе отключена анимация */
    @media (prefers-reduced-motion: reduce) {
      .sakura { display: none; }
      .avatar:hover { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Лепестки сакуры (15 штук) -->
  <div class="sakura" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="card">
    <div class="banner"></div>

    <div class="profile">
      <div class="avatar"></div>
      <div class="profile-info">
        <h1 class="name">Morion</h1>
        <p class="tag">@Remedyscence</p>
      </div>
    </div>

    <section class="about">
      <h2>Обо мне</h2>
      <p>
      Начинающий разработчик и просто человек, который ищет свой путь. Люблю аниме, музыку (особенно могут зацепить саундтреки). Просто стараюсь создавать крутые штуки параллельно, не сойдя с ума от учебы. Осторожно: тут могут быть философские мысли.
      </p>
    </section>
  </main>
</body>
</html>
